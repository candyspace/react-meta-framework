on:
  pull_request:
    branches:
      - release/**
      - main

jobs:
  push:
    runs-on: ubuntu-latest
    environment: Production
    env:
      # CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
      WEBFONTS_API_KEY: ${{ secrets.WEBFONTS_API_KEY }}
      NPM_KEY: ${{ secrets.GITHUB_TOKEN }}
    steps:

      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: init npm
        run: |
          echo "@candyspace:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${NPM_KEY}" >> .npmrc

      - name: pnpm
        uses: pnpm/action-setup@v6.0.2
        with:
          cache: true

      - name: node
        uses: actions/setup-node@v6.3.0
        with:
          node-version-file: package.json
          check-latest: true
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: install
        run: pnpm i

      - name: test
        run: pnpm run build

      # - name: chromatic
      #   uses: chromaui/action@latest
